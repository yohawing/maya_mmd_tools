[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maya_mmd_tools"
version = "0.5.0"
description = "A set of tools for working with MMD data in Autodesk Maya."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/yohawing/maya_mmd_tools"
"Bug Tracker" = "https://github.com/yohawing/maya_mmd_tools/issues"

[project.optional-dependencies]
dev = [
    "flip-evaluator>=1.7,<2; python_version >= '3.8'",
    "ruff==0.16.0",
]

[tool.setuptools.package-data]
mmd_tools = [
    "config/mmd_control_rig_curve_shapes.json",
    "ui/assets/animator_toolset/*.png",
    "ui/assets/animator_toolset/*.svg",
    "ui/assets/morph_types/*.svg",
    "ui/assets/symbols/*.svg",
    "ui/assets/app/*.svg",
]

[tool.setuptools.packages.find]
include = ["mmd_tools*"]

[tool.ruff]
line-length = 128
indent-width = 4
target-version = "py310"
fix = true

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults substantially. Keep the established
# error-focused baseline explicit so tool upgrades do not rewrite the project.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
