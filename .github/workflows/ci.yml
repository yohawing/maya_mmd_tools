name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff

      - name: Ruff
        run: ruff check --no-fix .

  ci-unit:
    name: Unit tests without Maya
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nox
        run: python -m pip install --upgrade pip nox uv

      - name: Run pure-Python unit tests
        run: nox -s ci_unit

      - name: Upload pure-Python unit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-log
          path: build/reports/ci_unit_tests.log
          if-no-files-found: warn

  golden-oracle:
    name: GoldenOracle numeric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nox
        run: python -m pip install --upgrade pip nox

      - name: Run numeric oracle
        run: nox -s golden_oracle
