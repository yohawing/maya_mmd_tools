name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check --no-fix .

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=maya_mmd_tools-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Build release zip
        shell: bash
        run: |
          set -euo pipefail
          package_root="dist/maya_mmd_tools"
          mkdir -p "${package_root}"

          cp -R mmd_tools "${package_root}/"
          cp -R plug-ins "${package_root}/"
          cp -R docs "${package_root}/"
          cp README.md LICENSE CHANGELOG.md maya_mmd_tools.mod userSetup.py pyproject.toml "${package_root}/"

          for optional_dir in config resources shaders examples; do
            if [[ -d "${optional_dir}" ]]; then
              cp -R "${optional_dir}" "${package_root}/"
            fi
          done

          find "${package_root}" -type d \( -name "__pycache__" -o -name ".pytest_cache" -o -name ".ruff_cache" \) -prune -exec rm -rf {} +
          find "${package_root}" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          python - <<'PY'
          import pathlib
          import shutil

          zip_name = "${{ steps.version.outputs.zip_name }}"
          base_name = pathlib.Path("dist") / pathlib.Path(zip_name).with_suffix("")
          shutil.make_archive(str(base_name), "zip", root_dir="dist", base_dir="maya_mmd_tools")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip_name }}
          path: dist/${{ steps.version.outputs.zip_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.version.outputs.zip_name }}
          prerelease: true
