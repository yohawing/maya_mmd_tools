name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check --no-fix .

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "zip_name=maya_mmd_tools-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Unit gate
        run: uvx nox -s ci_unit

      - name: GoldenOracle numeric gate
        run: uvx nox -s golden_oracle

      - name: Version marker gate
        run: uvx nox -s release_version -- --version "${{ steps.version.outputs.version }}"

      - name: Build and validate release ZIP
        run: uvx nox -s release_package -- --version "${{ steps.version.outputs.version }}"

      - name: Build release notes
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re

          version = "${{ steps.version.outputs.version }}"
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\].*?\n(?P<body>.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit(f"CHANGELOG.md does not contain a section for {version}")

          body = match.group("body").strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty")

          pathlib.Path("dist/release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip_name }}
          path: dist/${{ steps.version.outputs.zip_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.version.outputs.zip_name }}
          body_path: dist/release-notes.md
          prerelease: false
